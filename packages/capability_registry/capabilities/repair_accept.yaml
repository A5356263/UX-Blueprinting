{
  "capability_id": "repair_accept",
  "display_name": "Repair Accept",
  "type": "repair",
  "stage": "repair",
  "entrypoint": "python -m packages repair-accept <project-id> <issue-id> --reason <accepted-reason>",
  "description": "对非 blocker 问题执行正式接受，并把接受理由写回 remediation 状态。",
  "required_inputs": [
    "projects/<project-id>/runtime/remediation/issue_index.json",
    "projects/<project-id>/runtime/remediation/retry_scope.json",
    "<issue-id>",
    "--reason <accepted-reason>",
    "已按 retry_scope 完成 scoped rerun"
  ],
  "declared_outputs": [
    "projects/<project-id>/runtime/remediation/issue_index.json",
    "projects/<project-id>/runtime/remediation/remediation_plan.json",
    "projects/<project-id>/runtime/remediation/retry_scope.json",
    "projects/<project-id>/runtime/remediation/repair_summary.md",
    "projects/<project-id>/runtime/remediation/repair_run_log.jsonl"
  ],
  "dependencies": [
    "repair_plan"
  ],
  "retryable": true,
  "review_required": true,
  "mutates_formal_artifacts": false,
  "mutates_runtime_state": true,
  "source_of_truth_refs": [
    "specs/11_repair_loop_contract.md",
    "packages/__main__.py",
    "packages/repair_loop/repair_close.py",
    "docs/runbook/repair_loop_flow.md"
  ],
  "status": "active"
}
