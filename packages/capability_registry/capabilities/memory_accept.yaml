{
  "capability_id": "memory_accept",
  "display_name": "Memory Accept",
  "type": "command",
  "stage": "cross_stage",
  "entrypoint": "python -m packages memory-accept <project-id>",
  "description": "把项目级 candidate 中可复用的 memory 写入顶层长期 memory 子系统，并刷新 memory 索引。",
  "required_inputs": [
    "projects/<project-id>/runtime/memory/extracted_memory_candidates.json",
    "memory/index.json"
  ],
  "declared_outputs": [
    "projects/<project-id>/runtime/memory/accepted_memory_items.json",
    "projects/<project-id>/runtime/memory/memory_trace.json",
    "memory/index.json",
    "memory/patterns/**/*.json",
    "memory/failure_modes/**/*.json",
    "memory/capability_insights/*.json"
  ],
  "dependencies": [
    "memory_extract"
  ],
  "retryable": true,
  "review_required": false,
  "mutates_formal_artifacts": true,
  "mutates_runtime_state": true,
  "source_of_truth_refs": [
    "specs/13_memory_layer_contract.md",
    "packages/__main__.py",
    "packages/memory_layer/accept_memory.py",
    "docs/runbook/memory_layer_flow.md"
  ],
  "status": "active"
}
