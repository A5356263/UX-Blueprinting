{
  "capability_id": "task_bootstrap",
  "display_name": "Task Bootstrap",
  "type": "command",
  "stage": "mainline",
  "entrypoint": "python -m packages bootstrap <project-id> --domain <domain>",
  "description": "作为正式蓝图主链路前半段的目录初始化能力，创建项目任务工作区并生成 source 输入骨架。",
  "required_inputs": [
    "<project-id>",
    "templates/task_card.template.md"
  ],
  "declared_outputs": [
    "projects/<project-id>/source/task_card.md",
    "projects/<project-id>/source/requirement.md",
    "projects/<project-id>/source/background.md",
    "projects/<project-id>/workspace/",
    "projects/<project-id>/runtime/gates/",
    "projects/<project-id>/runtime/project_structure_check.json",
    "projects/<project-id>/runtime/project_structure_check.md",
    "projects/<project-id>/meta.json"
  ],
  "dependencies": [],
  "retryable": true,
  "review_required": false,
  "mutates_formal_artifacts": true,
  "mutates_runtime_state": true,
  "source_of_truth_refs": [
    "specs/01_execution_hub_spec.md",
    "packages/__main__.py",
    "packages/task_bootstrap/core.py",
    "docs/runbook/external_ai_quickstart.md"
  ],
  "status": "active"
}
