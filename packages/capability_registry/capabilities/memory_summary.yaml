{
  "capability_id": "memory_summary",
  "display_name": "Memory Summary",
  "type": "command",
  "stage": "cross_stage",
  "entrypoint": "python -m packages memory-summary <project-id>",
  "description": "根据项目级 memory candidate 与 accepted 结果生成用户可读的 workspace/memory_summary.md。",
  "required_inputs": [
    "projects/<project-id>/runtime/memory/extracted_memory_candidates.json",
    "projects/<project-id>/runtime/memory/accepted_memory_items.json"
  ],
  "declared_outputs": [
    "projects/<project-id>/workspace/memory_summary.md"
  ],
  "dependencies": [
    "memory_extract",
    "memory_accept"
  ],
  "retryable": true,
  "review_required": false,
  "mutates_formal_artifacts": true,
  "mutates_runtime_state": false,
  "source_of_truth_refs": [
    "specs/13_memory_layer_contract.md",
    "packages/__main__.py",
    "packages/memory_layer/write_memory_summary.py",
    "docs/runbook/memory_layer_flow.md"
  ],
  "status": "active"
}
