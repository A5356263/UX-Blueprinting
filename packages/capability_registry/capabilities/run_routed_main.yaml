    "projects/<project-id>/runtime/routed_main_report.json",
    "projects/<project-id>/workspace/*.md"
  ],
  "retryable": true,
  "review_required": false,
  "mutates_formal_artifacts": true,
  "mutates_runtime_state": true,
  "source_of_truth_refs": [
    "packages/routed_main/core.py",
    "specs/18_routed_main_contract.md",
    "docs/discussion/UXB SKILL优化/04_阶段三实施方案_执行前确认版.md"
  ],
