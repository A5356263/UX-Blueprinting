{
  "capability_id": "run_routed_main",
  "display_name": "Run Routed Main",
  "type": "command",
  "stage": "mainline",
  "entrypoint": "python -m packages run-routed-main <project-id> [--route auto|fast|standard|full]",
  "description": "独立试运行 route-aware 主链路编排，不改变 run-main 默认行为。",
  "required_inputs": [
    "projects/<project-id>/source/requirement.md"
