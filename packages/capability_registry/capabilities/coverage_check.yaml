{
  "capability_id": "coverage_check",
  "display_name": "Coverage Check",
  "type": "final_check",
  "stage": "final",
  "entrypoint": "python -m packages coverage <project-id>",
  "description": "在 validate 基础上按当前 execution mode 自动选择 full 或 lite 覆盖检查，并刷新最终机器状态；只报告断点与风险，不生成固定方案结论。",
  "required_inputs": [
    "projects/<project-id>/workspace/check_report.md",
    "projects/<project-id>/workspace/check_status.json",
    "projects/<project-id>/workspace/facts.md",
    "projects/<project-id>/workspace/business_blueprint.md 或 business_blueprint_lite.md 或 business_note.md",
    "projects/<project-id>/workspace/experience_blueprint.md"
  ],
  "declared_outputs": [
    "projects/<project-id>/workspace/check_report.md",
    "projects/<project-id>/workspace/check_status.json",
    "projects/<project-id>/runtime/trace_index.json",
    "projects/<project-id>/runtime/gate_metrics.json"
  ],
  "dependencies": [
    "validate_outputs"
  ],
  "retryable": true,
  "review_required": false,
  "mutates_formal_artifacts": true,
  "mutates_runtime_state": true,
  "source_of_truth_refs": [
    "specs/01_execution_hub_spec.md",
    "specs/06_check_contract.md",
    "packages/__main__.py",
    "packages/validate/core.py",
    "docs/runbook/external_ai_quickstart.md",
    "docs/runbook/task_execution_flow.md"
  ],
  "status": "active"
}
