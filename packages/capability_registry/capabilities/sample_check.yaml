{
  "capability_id": "sample_check",
  "display_name": "Sample Check",
  "type": "command",
  "stage": "benchmark",
  "entrypoint": "python -m packages sample-check",
  "description": "对 examples/ 下的 benchmark_positive / benchmark_negative 样例执行独立回归校验，不把样例当作普通真实项目处理。",
  "required_inputs": [
    "examples/positive/*/meta.json",
    "examples/negative/*/meta.json"
  ],
  "declared_outputs": [
    "examples/_runtime/sample_check_report.json"
  ],
  "retryable": true,
  "review_required": false,
  "mutates_formal_artifacts": false,
  "mutates_runtime_state": true,
  "source_of_truth_refs": [
    "packages/mainline.py",
    "packages/common.py"
  ],
  "status": "active"
}
