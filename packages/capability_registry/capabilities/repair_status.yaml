    "stdout: repair_loop_status",
    "stdout: open_issue_count",
    "stdout: open_blocker_count",
    "stdout: deferred_blocker_count",
    "stdout: recommended_commands"
  ],
  "dependencies": [
    "repair_plan"
  ],
  "retryable": true,
  "review_required": false,
  "mutates_formal_artifacts": false,
  "mutates_runtime_state": false,
  "source_of_truth_refs": [
    "specs/11_repair_loop_contract.md",
    "packages/__main__.py",
    "packages/repair_loop/repair_close.py",
    "docs/runbook/external_ai_quickstart.md",
    "docs/runbook/repair_loop_flow.md"
  ],
  "status": "active"
}
