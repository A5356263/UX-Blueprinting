{
  "capability_id": "repair_status",
  "display_name": "Repair Status",
  "type": "repair",
  "stage": "repair",
  "entrypoint": "python -m packages repair-status <project-id>",
  "description": "读取当前 remediation 状态并输出 repair loop 是否仍存在 open 或 deferred blocker。",
  "required_inputs": [
    "projects/<project-id>/runtime/remediation/issue_index.json",
    "projects/<project-id>/runtime/remediation/retry_scope.json"
