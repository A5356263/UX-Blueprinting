<article class="preview-content-panel is-active" data-skill="journey-analysis" id="journey-analysis-panel">
  <style>
    .journey-page {
      --journey-ink: #1f2937;
      --journey-muted: #6b7280;
      --journey-line: #e5e7eb;
      --journey-paper: #fff;
      --journey-soft: #f3f4f6;
      --journey-warm: #fef3c7;
      --journey-green: #ecfdf5;
      color: var(--journey-ink);
    }

    .journey-header {
      margin-bottom: 22px;
    }

    .journey-title {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--journey-ink);
    }

    .journey-subtitle {
      margin: 0;
      font-size: 14px;
      color: var(--journey-muted);
    }

    .journey-persona-card {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      margin: 14px 0 26px;
      background: var(--journey-paper);
      border: 1px solid var(--journey-line);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .journey-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 16px;
      flex: 0 0 auto;
    }

    .journey-persona-info b {
      display: block;
      font-size: 15px;
      color: #111827;
      margin-bottom: 3px;
    }

    .journey-persona-info span {
      display: block;
      font-size: 13px;
      color: var(--journey-muted);
      max-width: 720px;
      line-height: 1.5;
    }

    .journey-jtbd {
      margin: 0 0 26px;
      padding: 12px 16px;
      background: var(--journey-warm);
      border-left: 4px solid #f59e0b;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.6;
      font-style: italic;
    }

    .journey-map-wrap {
      overflow-x: auto;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .journey-grid {
      display: grid;
      min-width: 1080px;
      gap: 1px;
      background: var(--journey-line);
      overflow: hidden;
      border-radius: 12px;
    }

    .journey-label,
    .journey-stage-header,
    .journey-cell {
      padding: 14px 12px;
      font-size: 12px;
      background: var(--journey-paper);
    }

    .journey-label {
      background: var(--journey-soft);
      font-weight: 700;
      color: #4b5563;
      display: flex;
      align-items: center;
      font-size: 13px;
      position: sticky;
      left: 0;
      z-index: 2;
    }

    .journey-stage-header {
      background: #1f2937;
      color: white;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
    }

    .journey-stage-index {
      display: block;
      margin: 0 auto 6px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      line-height: 28px;
      font-size: 12px;
    }

    .journey-cell {
      line-height: 1.45;
      color: var(--journey-ink);
      min-height: 72px;
    }

    .journey-cell ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .journey-cell li {
      padding: 3px 0;
    }

    .journey-cell li::before {
      content: "·";
      color: #9ca3af;
      margin-right: 6px;
    }

    .journey-goal {
      background: #f0fdf4;
      color: #166534;
      border-radius: 4px;
      padding: 7px 8px;
      font-weight: 600;
      text-align: center;
      line-height: 1.45;
    }

    .journey-quote {
      font-style: italic;
      color: #4b5563;
      padding: 7px 9px;
      background: #f9fafb;
      border-left: 3px solid #d1d5db;
      border-radius: 3px;
    }

    .journey-signal {
      text-align: center;
      font-size: 13px;
      color: #4b5563;
    }

    .journey-confidence {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      padding: 4px 10px;
      margin-bottom: 8px;
      border-radius: 999px;
      font-weight: 700;
      border: 1px solid currentColor;
    }

    .journey-confidence-high { color: #059669; background: #d1fae5; }
    .journey-confidence-medium { color: #d97706; background: #fef3c7; }
    .journey-confidence-low { color: #dc2626; background: #fee2e2; }

    .journey-risk-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      background: #fee2e2;
      color: #dc2626;
    }

    .journey-opportunity {
      background: var(--journey-green);
      color: #047857;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin: 3px 0;
      line-height: 1.45;
    }

    .journey-transition {
      margin-top: 22px;
      padding: 16px 18px;
      background: var(--journey-paper);
      border: 1px solid var(--journey-line);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .journey-transition h3 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #111827;
    }

    .journey-transition p {
      margin: 0;
      color: var(--journey-muted);
      font-size: 13px;
      line-height: 1.7;
    }
  </style>

  <div class="journey-page">
    <!-- JOURNEY_CONTENT -->
  </div>
</article>
