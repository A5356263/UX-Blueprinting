<!-- module.detail-action-bar.basic | 底部操作栏：审批操作 + 页面级操作（导出/打印）。
     操作按钮根据查看人员角色和单据状态动态展示，非固定组合。
     例：审批人看审批中单据 → 同意/拒绝/退回/转派
         申请人看自己的单据 → 撤回
         查看已完成单据 → 导出/打印 -->
<footer class="detail-action-bar" data-module="action-bar" aria-label="底部操作栏">
  <div class="action-buttons" role="toolbar" aria-label="单据操作">
    <!-- 审批操作区（按角色+状态展示） -->
    <button type="button" class="btn-primary"  data-action="approve">同意</button>
    <button type="button" class="btn-danger"   data-action="reject">拒绝</button>
    <button type="button" class="btn-default"  data-action="return">退回</button>
    <button type="button" class="btn-default"  data-action="recall">召回</button>
    <button type="button" class="btn-default"  data-action="transfer">转派</button>
    <button type="button" class="btn-default"  data-action="add-sign">加签</button>
    <button type="button" class="btn-default"  data-action="comment">评论</button>
    <!-- 页面级操作（始终可用，靠右） -->
    <span class="action-spacer"></span>
    <button type="button" class="btn-default" data-action="export">导出</button>
    <button type="button" class="btn-default" data-action="print">打印</button>
  </div>
</footer>
