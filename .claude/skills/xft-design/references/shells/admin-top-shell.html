<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Top Shell</title>
  <style>
    :root {
      --xftv0-shell-topbar-height: 48px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--color-text-neutral-gray50);
      background: var(--color-layout-bg-neutral-gray);
      font-family: var(--font-family-primary, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif);
      font-size: 14px;
      line-height: 22px;
      overflow: hidden;
    }

    .xftv0-top-shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-layout-bg-neutral-gray);
    }

    .xftv0-top-shell-topbar-slot {
      flex: 0 0 var(--xftv0-shell-topbar-height);
      min-height: var(--xftv0-shell-topbar-height);
    }

    .xftv0-top-shell-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      background: #ffffff;
    }

    .xftv0-top-shell-content {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: #f3f4f6;
      padding: 16px;
    }

    .xftv0-top-shell-content-inner {
      min-height: 100%;
      width: 100%;
      padding: 16px;
      background: #ffffff;
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="xftv0-top-shell">
    <div class="xftv0-top-shell-topbar-slot">
      <!-- TOPBAR_SLOT -->
    </div>

    <main class="xftv0-top-shell-main">
      <section class="xftv0-top-shell-content">
        <div class="xftv0-top-shell-content-inner">
          <!-- PAGE_CONTENT_SLOT -->
        </div>
      </section>
    </main>

    <div id="overlay-root">
      <!-- OVERLAY_SLOT -->
    </div>
  </div>
</body>
</html>
