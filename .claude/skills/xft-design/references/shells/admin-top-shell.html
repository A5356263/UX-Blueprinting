<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Top Shell</title>
  <style>
    :root {
      --xftv0-shell-topbar-height: 48px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--color-text-neutral-gray50);
      background: var(--color-layout-bg-neutral-gray);
      font-family: var(--font-family-primary, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif);
      font-size: 14px;
      line-height: 22px;
      overflow: hidden;
    }

    .xftv0-top-shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-layout-bg-neutral-gray);
    }

    .xftv0-top-shell-topbar-slot {
      flex: 0 0 var(--xftv0-shell-topbar-height);
      min-height: var(--xftv0-shell-topbar-height);
    }

    .xftv0-top-shell-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      background: #ffffff;
    }

    .xftv0-top-shell-content {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      background: var(--color-layout-bg-neutral-gray);
      padding: var(--spacing-6);
    }

    .xftv0-top-shell-content-inner {
      min-height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-6);
    }

    .xftv0-surface {
      background: var(--color-container-bg-neutral-bright);
      border: 1px solid var(--color-border-neutral);
      border-radius: var(--border-radius-large);
      padding: var(--spacing-6);
      box-shadow: var(--shadow-regular-bottom);
    }

    .xftv0-surface--nested {
      background: var(--color-container-bg-neutral-bright);
      border: 1px solid var(--color-border-neutral);
      border-radius: var(--border-radius-large);
      padding: var(--spacing-5);
    }

    .xftv0-wrapper {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-4);
    }
  </style>
</head>
<body>
  <!-- FROZEN: 页面壳结构、flex 布局、slot 尺寸变量、基础 body 样式 -->
  <div class="xftv0-top-shell">
    <div class="xftv0-top-shell-topbar-slot">
      <!-- TOPBAR_SLOT -->
    </div>

    <main class="xftv0-top-shell-main">
      <section class="xftv0-top-shell-content">
        <div class="xftv0-top-shell-content-inner">
          <!-- /FROZEN -->
          <!-- EDITABLE: 页面主内容 - 按 layout 骨架填充，使用 .xftv0-surface 包裹区域组 -->
          <!-- PAGE_CONTENT_SLOT -->
          <!-- /EDITABLE -->
        </div>
      </section>
    </main>

    <!-- EDITABLE: 弹层内容 - 按需求添加 modal/drawer -->
    <div id="overlay-root">
      <!-- OVERLAY_SLOT -->
    </div>
    <!-- /EDITABLE -->
  </div>
  <!-- /FROZEN -->
</body>
</html>
