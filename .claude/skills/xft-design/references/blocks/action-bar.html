<style>
  .xftv0-action-bar {
    --xftv0-action-bar-height: 32px;
    --xftv0-action-bar-gap: var(--spacing-6, 24px);
    --xftv0-action-bar-inner-gap: var(--spacing-2, 8px);
    --xftv0-action-bar-icon-gap: var(--spacing-1, 4px);
    --xftv0-action-bar-panel-width: 132px;
    --xftv0-action-bar-icon-size: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--xftv0-action-bar-gap);
    width: 100%;
    min-width: 0;
    min-height: var(--xftv0-action-bar-height);
  }

  .xftv0-action-bar-business,
  .xftv0-action-bar-utility {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: var(--xftv0-action-bar-inner-gap);
    min-width: 0;
  }

  .xftv0-action-bar-business {
    flex: 1 1 auto;
  }

  .xftv0-action-bar-utility {
    flex: 0 0 auto;
    margin-left: auto;
  }

  .xftv0-action-bar-context {
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    gap: var(--xftv0-action-bar-inner-gap);
    min-width: 0;
    margin-right: var(--xftv0-action-bar-inner-gap);
  }

  .xftv0-action-bar-context-label {
    color: var(--color-text-neutral-gray30, rgba(19, 34, 64, 0.65));
    font-size: var(--font-size-small, 12px);
    line-height: 20px;
    white-space: nowrap;
  }

  .xftv0-action-bar-button-group,
  .xftv0-action-bar-icon-actions {
    display: inline-flex;
    align-items: center;
    flex-wrap: nowrap;
    min-width: 0;
  }

  .xftv0-action-bar-button-group {
    gap: var(--xftv0-action-bar-inner-gap);
  }

  .xftv0-action-bar-icon-actions {
    gap: var(--xftv0-action-bar-icon-gap);
  }

  .xftv0-action-bar .btn,
  .xftv0-action-bar .xftv0-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 0 0 auto;
    height: var(--xftv0-action-bar-height);
    padding: 0 14px;
    border: 1px solid var(--color-border-neutral, rgba(19, 34, 64, 0.15));
    border-radius: var(--border-radius-regular, 6px);
    background: var(--color-container-bg-neutral-bright, #fff);
    color: var(--color-text-neutral-gray40, rgba(19, 34, 64, 0.85));
    font-size: var(--font-size-regular, 14px);
    line-height: var(--font-height-regular, 1.6);
    font-weight: var(--font-weight-regular, 400);
    font-family: var(--font-family-primary, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif);
    white-space: nowrap;
    cursor: pointer;
    transition:
      color var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1)),
      background-color var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1)),
      border-color var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1)),
      box-shadow var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1));
  }

  .xftv0-action-bar .btn:hover,
  .xftv0-action-bar .xftv0-button:hover {
    border-color: var(--color-border-accent-regular, #1966ff);
    color: var(--color-text-accent-regular, #1966ff);
  }

  .xftv0-action-bar .btn:focus-visible,
  .xftv0-action-bar .xftv0-button:focus-visible {
    outline: 2px solid var(--color-border-accent-regular, #1966ff);
    outline-offset: 2px;
  }

  .xftv0-action-bar .btn-primary,
  .xftv0-action-bar .xftv0-button-primary {
    border-color: var(--color-border-accent-regular, #1966ff);
    background: var(--color-bg-accent-regular, #1966ff);
    color: var(--color-text-neutral-inverse50, #fff);
  }

  .xftv0-action-bar .btn-primary:hover,
  .xftv0-action-bar .xftv0-button-primary:hover {
    border-color: var(--color-border-accent-regular-hover, #4086ff);
    background: var(--color-bg-accent-regular-hover, #4086ff);
    color: var(--color-text-neutral-inverse50, #fff);
  }

  .xftv0-action-bar-icon-button {
    width: var(--xftv0-action-bar-height);
    min-width: var(--xftv0-action-bar-height);
    padding: 0;
  }

  .xftv0-action-bar-icon-button:hover,
  .xftv0-action-bar-icon-button[aria-expanded="true"] {
    border-color: var(--color-border-accent-regular, #1966ff);
    background: var(--color-bg-accent-light, #ebf3ff);
    color: var(--color-text-accent-regular, #1966ff);
  }

  .xftv0-action-bar-icon {
    width: var(--xftv0-action-bar-icon-size);
    height: var(--xftv0-action-bar-icon-size);
    display: block;
    opacity: 0.72;
    transition: opacity var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1));
  }

  .xftv0-action-bar-icon-button:hover .xftv0-action-bar-icon,
  .xftv0-action-bar-icon-button:focus-visible .xftv0-action-bar-icon,
  .xftv0-action-bar-icon-button[aria-expanded="true"] .xftv0-action-bar-icon {
    opacity: 1;
  }

  .xftv0-action-bar-disclosure {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
  }

  .xftv0-action-bar-more-button::after {
    content: "";
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: 0.72;
    transition:
      transform var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1)),
      opacity var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1));
  }

  .xftv0-action-bar-more-button[aria-expanded="true"]::after {
    transform: rotate(180deg);
    opacity: 1;
  }

  .xftv0-action-bar-more-panel {
    position: absolute;
    top: calc(100% + var(--xftv0-action-bar-inner-gap));
    right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-1, 4px);
    min-width: var(--xftv0-action-bar-panel-width);
    padding: var(--spacing-2, 8px);
    border: 1px solid var(--color-border-neutral, rgba(19, 34, 64, 0.15));
    border-radius: var(--border-radius-regular, 6px);
    background: var(--color-container-bg-neutral-bright, #fff);
    box-shadow: var(--shadow-small-bottom, 0 6px 16px rgba(31, 35, 41, 0.08));
  }

  .xftv0-action-bar-more-panel[hidden] {
    display: none !important;
  }

  .xftv0-action-bar-more-panel .btn,
  .xftv0-action-bar-more-panel .xftv0-button {
    justify-content: flex-start;
    width: 100%;
    border-color: transparent;
    background: transparent;
    color: var(--color-text-neutral-gray40, rgba(19, 34, 64, 0.85));
  }

  .xftv0-action-bar-more-panel .btn:hover,
  .xftv0-action-bar-more-panel .xftv0-button:hover {
    border-color: transparent;
    background: var(--color-bg-accent-light, #ebf3ff);
    color: var(--color-text-accent-regular, #1966ff);
  }
</style>

<div class="xftv0-action-bar">
  <div class="xftv0-action-bar-business">
    <div class="xftv0-action-bar-button-group">
      <button class="xftv0-button xftv0-button-primary btn btn-primary" type="button">新增</button>
      <button class="xftv0-button btn" type="button">导入</button>
      <button class="xftv0-button btn" type="button">导出</button>
      <button class="xftv0-button btn" type="button">批量启用</button>
    </div>

    <div class="xftv0-action-bar-disclosure">
      <button
        class="xftv0-button btn xftv0-action-bar-more-button"
        type="button"
        data-disclosure-trigger
        data-disclosure-id="action-bar-more"
        aria-expanded="false"
      >
        更多
      </button>
      <div
        class="xftv0-action-bar-more-panel"
        data-disclosure-panel="action-bar-more"
        hidden
        aria-hidden="true"
      >
        <button class="xftv0-button btn" type="button">批量导出</button>
        <button class="xftv0-button btn" type="button">批量停用</button>
      </div>
    </div>
  </div>

  <div class="xftv0-action-bar-utility">
    <div class="xftv0-action-bar-icon-actions">
      <button class="xftv0-button btn xftv0-action-bar-icon-button" type="button" aria-label="刷新">
        <img class="xftv0-action-bar-icon" src="../../assets/icons/search.svg" alt="" />
      </button>
      <button class="xftv0-button btn xftv0-action-bar-icon-button" type="button" aria-label="下载">
        <img class="xftv0-action-bar-icon" src="../../assets/icons/download.svg" alt="" />
      </button>
      <button class="xftv0-button btn xftv0-action-bar-icon-button" type="button" aria-label="列设置">
        <img class="xftv0-action-bar-icon" src="../../assets/icons/setting.svg" alt="" />
      </button>
    </div>
  </div>
</div>
