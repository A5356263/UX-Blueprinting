<div
  class="xftv0-page-tabs"
  data-tabs-root
  aria-label="页面页签"
>
  <!-- FROZEN: 页签栏样式和容器结构 -->
  <style>
    .xftv0-page-tabs {
      --xftv0-page-tabs-height: 32px;
      --xftv0-page-tabs-item-width: 128px;
      --xftv0-page-tabs-right-width: 112px;

      display: flex;
      width: 100%;
      height: var(--xftv0-page-tabs-height);
      background: #e7e9ec;
      border-bottom: 1px solid var(--color-divider-neutral);
      color: rgba(19, 34, 64, 0.85);
      font-size: 12px;
      line-height: 20px;
    }

    .xftv0-page-tabs *,
    .xftv0-page-tabs *::before,
    .xftv0-page-tabs *::after {
      box-sizing: border-box;
    }

    .xftv0-page-tabs button {
      font: inherit;
    }

    .xftv0-page-tabs-track {
      display: flex;
      flex: 1 1 auto;
      overflow: hidden;
      min-width: 0;
    }

    .xftv0-page-tabs-list {
      display: flex;
      min-width: 0;
    }

    .xftv0-page-tab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      width: var(--xftv0-page-tabs-item-width);
      flex: 0 0 var(--xftv0-page-tabs-item-width);
      height: var(--xftv0-page-tabs-height);
      padding: 6px 12px;
      border: 0;
      border-radius: 8px 8px 0 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .xftv0-page-tab::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      width: 1px;
      height: 16px;
      background: rgba(19, 34, 64, 0.1);
    }

    .xftv0-page-tab:first-child::before,
    .xftv0-page-tab.is-active::before,
    .xftv0-page-tab:hover::before,
    .xftv0-page-tab.is-active + .xftv0-page-tab::before,
    .xftv0-page-tab:hover + .xftv0-page-tab::before {
      width: 0;
    }

    .xftv0-page-tab-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .xftv0-page-tab-close {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: transparent;
    }

    .xftv0-page-tab:hover {
      background: #dcdee2;
    }

    .xftv0-page-tab:hover .xftv0-page-tab-close,
    .xftv0-page-tab.is-active .xftv0-page-tab-close {
      display: inline-flex;
    }

    .xftv0-page-tab.is-active {
      background: #f3f4f6;
      color: rgba(19, 34, 64, 0.95);
    }

    .xftv0-page-tabs-ops {
      width: var(--xftv0-page-tabs-right-width);
      flex: 0 0 var(--xftv0-page-tabs-right-width);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 16px 4px 8px;
      background: #f3f4f6;
      box-shadow: -4px 0 12px rgba(19, 34, 64, 0.08);
    }

    .xftv0-page-tabs-op {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: rgba(19, 34, 64, 0.65);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .xftv0-page-tabs-op:hover {
      background: rgba(19, 34, 64, 0.05);
    }

    .xftv0-page-tabs-op svg,
    .xftv0-page-tab-close svg {
      width: 16px;
      height: 16px;
    }
  </style>
  <!-- /FROZEN -->

  <div class="xftv0-page-tabs-track">
    <!-- EDITABLE: 标签页列表 - 标签名称按业务需求配置 -->
    <div class="xftv0-page-tabs-list" data-slot="page_tabs_slot">
      <button class="xftv0-page-tab" type="button" data-tab-trigger aria-selected="false">
        <span class="xftv0-page-tab-name">首页</span>
      </button>
      <button class="xftv0-page-tab" type="button" data-tab-trigger aria-selected="false">
        <span class="xftv0-page-tab-name">组织管理</span>
        <span class="xftv0-page-tab-close" data-tab-close aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M3.71 3.71a1 1 0 011.41 0L8 6.59l2.88-2.88a1 1 0 111.41 1.41L9.41 8l2.88 2.88a1 1 0 01-1.41 1.41L8 9.41l-2.88 2.88a1 1 0 01-1.41-1.41L6.59 8 3.71 5.12a1 1 0 010-1.41z" />
          </svg>
        </span>
      </button>
      <button class="xftv0-page-tab is-active" type="button" data-tab-trigger aria-selected="true">
        <span class="xftv0-page-tab-name">员工台账列表</span>
        <span class="xftv0-page-tab-close" data-tab-close aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M3.71 3.71a1 1 0 011.41 0L8 6.59l2.88-2.88a1 1 0 111.41 1.41L9.41 8l2.88 2.88a1 1 0 01-1.41 1.41L8 9.41l-2.88 2.88a1 1 0 01-1.41-1.41L6.59 8 3.71 5.12a1 1 0 010-1.41z" />
          </svg>
        </span>
      </button>
    </div>
    <!-- /EDITABLE -->
    <!-- FROZEN: 页签栏样式和容器结构 -->
  </div>

  <div class="xftv0-page-tabs-ops">
    <button class="xftv0-page-tabs-op" type="button" aria-label="上一页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <button class="xftv0-page-tabs-op" type="button" aria-label="下一页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
    <button class="xftv0-page-tabs-op" type="button" aria-label="更多页签">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="5" cy="12" r="1.5" />
        <circle cx="12" cy="12" r="1.5" />
        <circle cx="19" cy="12" r="1.5" />
      </svg>
    </button>
  </div>
  <!-- /FROZEN -->

</div>
