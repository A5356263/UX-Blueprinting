<header
  class="xftv0-topbar"
  data-disclosure-root
  aria-label="顶部导航"
>
  <!-- FROZEN: 顶部导航样式和容器结构 -->
  <style>
    .xftv0-topbar {
      --xftv0-topbar-height: 48px;
      --xftv0-topbar-gradient-start: #3c8aff;
      --xftv0-topbar-gradient-end: #4255ff;
      --xftv0-topbar-text: rgba(249, 249, 250, 0.98);
      --xftv0-topbar-text-muted: rgba(255, 255, 255, 0.72);
      --xftv0-topbar-hover: rgba(249, 249, 250, 0.1);

      height: var(--xftv0-topbar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px 0 14px;
      background: linear-gradient(117.84deg, var(--xftv0-topbar-gradient-start), var(--xftv0-topbar-gradient-end));
      color: var(--xftv0-topbar-text);
    }

    .xftv0-topbar *,
    .xftv0-topbar *::before,
    .xftv0-topbar *::after {
      box-sizing: border-box;
    }

    .xftv0-topbar button {
      font: inherit;
    }

    .xftv0-topbar-left,
    .xftv0-topbar-center,
    .xftv0-topbar-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .xftv0-topbar-left {
      flex: 1 1 auto;
      gap: 8px;
    }

    .xftv0-topbar-center {
      flex: 0 0 auto;
    }

    .xftv0-topbar-right {
      flex: 0 0 auto;
      gap: 4px;
    }

    .xftv0-topbar-brand {
      padding: 0 16px 0 6px;
      color: var(--xftv0-topbar-text);
      font-size: 22px;
      line-height: 26px;
      font-family: "Alimama_ShuHeiTi_Bold", "PingFang SC", "Microsoft YaHei", sans-serif;
      white-space: nowrap;
    }

    .xftv0-topbar-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.2);
      flex: 0 0 1px;
      margin: 0 4px;
    }

    .xftv0-topbar-chip,
    .xftv0-topbar-action,
    .xftv0-topbar-user,
    .xftv0-topbar-search {
      border: 0;
      background: transparent;
      color: inherit;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      min-width: 0;
    }

    .xftv0-topbar-chip,
    .xftv0-topbar-user {
      padding: 4px 8px 4px 6px;
      gap: 4px;
    }

    .xftv0-topbar-action {
      padding: 4px;
      justify-content: center;
    }

    .xftv0-topbar-chip:hover,
    .xftv0-topbar-action:hover,
    .xftv0-topbar-user:hover {
      background: var(--xftv0-topbar-hover);
    }

    .xftv0-topbar-search {
      width: 240px;
      height: 32px;
      gap: 6px;
      padding: 0 8px;
      background: rgba(255, 255, 255, 0.2);
      color: var(--xftv0-topbar-text-muted);
    }

    .xftv0-topbar-search:hover {
      background: rgba(255, 255, 255, 0.34);
    }

    .xftv0-topbar-search-label,
    .xftv0-topbar-chip-label,
    .xftv0-topbar-user-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .xftv0-topbar-chip-label,
    .xftv0-topbar-user-name {
      font-size: 14px;
      line-height: 22px;
    }

    .xftv0-topbar-user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1966ff;
      color: #fff;
      font-size: 11px;
      flex: 0 0 28px;
    }

    .xftv0-topbar-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }

    .xftv0-topbar-icon-lg {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
    }

    .xftv0-topbar-caret {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
    }
  </style>

  <div class="xftv0-topbar-left">
    <div class="xftv0-topbar-brand">企业管理台</div>
    <button class="xftv0-topbar-chip" type="button" data-disclosure-trigger data-disclosure-id="topbar-tenant" aria-expanded="false">
      <svg class="xftv0-topbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M5 19.5h14" />
        <path d="M7 18V8.2l5-3 5 3V18" />
        <path d="M9.5 10.5h5" />
      </svg>
      <span class="xftv0-topbar-chip-label">杭州示例企业</span>
      <svg class="xftv0-topbar-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
    <div class="xftv0-topbar-divider"></div>
    <!-- /FROZEN -->
    <!-- EDITABLE: 应用导航 - 按业务需求配置导航入口 -->
    <div data-slot="topbar_app_nav_slot">
      <button class="xftv0-topbar-chip" type="button">
        <svg class="xftv0-topbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="4" y="4" width="6" height="6" rx="1.5" />
          <rect x="14" y="4" width="6" height="6" rx="1.5" />
          <rect x="4" y="14" width="6" height="6" rx="1.5" />
          <rect x="14" y="14" width="6" height="6" rx="1.5" />
        </svg>
        <span class="xftv0-topbar-chip-label">应用中心</span>
      </button>
    </div>
    <!-- /EDITABLE -->
    <!-- FROZEN: 顶部导航样式和容器结构 -->
  </div>

  <div class="xftv0-topbar-center">
    <button class="xftv0-topbar-search" type="button" aria-label="全局搜索">
      <svg class="xftv0-topbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" />
        <path d="m16 16 4 4" />
      </svg>
      <span class="xftv0-topbar-search-label">搜索菜单、页面或成员</span>
    </button>
  </div>

  <div class="xftv0-topbar-right">
    <button class="xftv0-topbar-action" type="button" aria-label="消息中心">
      <svg class="xftv0-topbar-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M6.5 10a5.5 5.5 0 1 1 11 0v2.2c0 2.2 1.1 4 2.5 4.8H4c1.4-.8 2.5-2.6 2.5-4.8V10Z" />
        <path d="M10.2 19a2 2 0 0 0 3.6 0" />
      </svg>
    </button>
    <button class="xftv0-topbar-action" type="button" aria-label="帮助中心">
      <svg class="xftv0-topbar-icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 10.5v5" />
        <circle cx="12" cy="7.8" r=".8" fill="currentColor" stroke="none" />
      </svg>
    </button>
    <div class="xftv0-topbar-divider"></div>
    <!-- /FROZEN -->
    <!-- EDITABLE: 用户信息 - 用户名和头像按实际用户展示 -->
    <button class="xftv0-topbar-user" type="button" data-disclosure-trigger data-disclosure-id="topbar-user" aria-expanded="false">
      <span class="xftv0-topbar-user-avatar">用</span>
      <span class="xftv0-topbar-user-name">用户名</span>
      <svg class="xftv0-topbar-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
    <!-- /EDITABLE -->
    <!-- FROZEN: 顶部导航样式和容器结构 -->
  </div>

  <!-- /FROZEN -->
</header>
