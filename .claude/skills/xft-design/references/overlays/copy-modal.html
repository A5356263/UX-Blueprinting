<style>
  :root {
    --copy-modal-width: 740px;
    --copy-modal-max-height: calc(100vh - 64px);
  }

  .xft-modal-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: rgba(19, 34, 64, 0.36);
    z-index: 1000;
  }

  .xft-modal-overlay[hidden] {
    display: none;
  }

  .xft-modal {
    display: flex;
    flex-direction: column;
    width: min(100%, var(--copy-modal-width));
    max-height: var(--copy-modal-max-height);
    background: var(--color-container-bg-neutral-bright);
    border-radius: var(--border-radius-large);
    box-shadow: var(--shadow-regular-bottom);
    overflow: hidden;
  }

  .xft-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-3);
    padding: var(--spacing-4) var(--spacing-5);
    border-bottom: 1px solid var(--color-divider-neutral);
    flex-shrink: 0;
  }

  .xft-modal-title {
    margin: 0;
    font-size: var(--font-size-heading-5);
    line-height: var(--font-height-tight);
    font-weight: var(--font-weight-bold);
    color: var(--color-text-neutral-gray50);
  }

  .xft-modal-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: var(--border-radius-small);
    background: transparent;
    color: var(--color-text-neutral-gray30);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }

  .xft-modal-body {
    flex: 1 1 auto;
    padding: var(--spacing-5);
    overflow-y: auto;
    color: var(--color-text-neutral-gray40);
    font-size: var(--font-size-regular);
    line-height: var(--font-height-regular);
  }

  .xft-modal-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--spacing-2);
    padding: 12px var(--spacing-5);
    border-top: 1px solid var(--color-divider-neutral);
    flex-shrink: 0;
  }

  .xftv0-checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-3);
    margin-top: var(--spacing-4);
  }

  .xftv0-checkbox-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-2);
    padding: var(--spacing-2) var(--spacing-3);
    border-radius: 999px;
    border: 1px solid var(--color-divider-neutral);
    background: var(--color-container-bg-neutral-lightgray);
    color: var(--color-text-neutral-gray50);
  }

  .xftv0-checkbox-chip input {
    margin: 0;
  }

  .xftv0-inline-note {
    color: var(--color-text-neutral-gray30);
  }

  .xftv0-tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-2);
    margin-top: var(--spacing-4);
  }

  .xftv0-tag {
    display: inline-flex;
    align-items: center;
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    background: var(--color-container-bg-neutral-lightgray);
    color: var(--color-text-neutral-gray40);
    font-size: var(--font-size-small);
  }

  .xft-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--color-border-neutral);
    border-radius: var(--border-radius-regular);
    background: var(--color-container-bg-neutral-bright);
    color: var(--color-text-neutral-gray40);
    font-size: var(--font-size-regular);
    font-weight: var(--font-weight-regular);
    white-space: nowrap;
    cursor: pointer;
    transition:
      color var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1)),
      background-color var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1)),
      border-color var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1)),
      box-shadow var(--motion-fast, 150ms) var(--ease-standard, cubic-bezier(0.2, 0, 0, 1));
  }

  .xft-btn:hover {
    border-color: var(--color-border-accent-regular);
    color: var(--color-text-accent-regular);
  }

  .xft-btn:focus-visible {
    outline: 2px solid var(--color-border-accent-regular);
    outline-offset: 2px;
  }

  .xft-btn[disabled] {
    color: var(--color-text-neutral-gray10);
    border-color: var(--color-border-neutral);
    background: var(--color-container-bg-neutral-gray);
    cursor: not-allowed;
    box-shadow: none;
  }

  .xft-btn-primary {
    border-color: var(--color-border-accent-regular);
    background: var(--color-bg-accent-regular);
    color: var(--color-text-neutral-inverse50);
  }

  .xft-btn-primary:hover {
    border-color: var(--color-border-accent-regular-hover);
    background: var(--color-bg-accent-regular-hover);
    color: var(--color-text-neutral-inverse50);
  }

  @media (max-width: 640px) {
    .xft-modal-overlay {
      padding: 16px;
    }
  }

  @media (max-height: 560px) {
    .xft-modal-overlay {
      align-items: flex-start;
      padding: 16px;
    }

    .xft-modal {
      height: min(100%, var(--copy-modal-max-height));
    }
  }
</style>

<section class="xft-modal-overlay" id="copy-modal" data-overlay aria-hidden="true" hidden>
  <div class="xft-modal">
    <header class="xft-modal-header">
      <h2 class="xft-modal-title">复制配置</h2>
      <button class="xft-modal-close" type="button" aria-label="关闭" data-overlay-close>&times;</button>
    </header>
    <div class="xft-modal-body">
      <div class="xftv0-inline-note">从“华东大区标准模板”复制基础配置到当前对象。</div>
      <div class="xftv0-checkbox-group">
        <label class="xftv0-checkbox-chip"><input type="checkbox" checked />复制基础信息</label>
        <label class="xftv0-checkbox-chip"><input type="checkbox" checked />复制权限配置</label>
        <label class="xftv0-checkbox-chip"><input type="checkbox" />复制提醒规则</label>
      </div>
      <div class="xftv0-tag-row">
        <span class="xftv0-tag">组织架构</span>
        <span class="xftv0-tag">审批流</span>
        <span class="xftv0-tag">通知设置</span>
      </div>
    </div>
    <footer class="xft-modal-footer">
      <button class="xft-btn" type="button" data-overlay-close>取消</button>
      <button class="xft-btn xft-btn-primary" type="button">开始复制</button>
    </footer>
  </div>
</section>
