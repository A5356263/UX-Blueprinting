            <div class="form-field"><label class="field-label">出差类型</label><div class="select">请选择出差类型 <span>▾</span></div></div>
            <div class="form-field"><label class="field-label">出发城市</label><div class="select">请选择出发城市 <span>▾</span></div></div>
            <div class="form-field"><label class="field-label">目的城市</label><div class="select">请选择目的城市 <span>▾</span></div></div>
            <div class="form-field"><label class="field-label">开始日期</label><input class="input" placeholder="请选择开始日期"></div>
            <div class="form-field"><label class="field-label">结束日期</label><input class="input" placeholder="请选择结束日期"></div>
            <div class="form-field full"><label class="field-label">出差说明</label><textarea class="textarea" placeholder="请详细说明本次出差的具体安排和预期成果"></textarea></div>
          </div>
        </fieldset>

        <!-- 行程明细 -->
        <fieldset class="form-block">
          <legend>行程明细</legend>
          <div class="data-table-wrap" style="margin-bottom:var(--spacing-2)">
            <table class="data-table">
              <thead><tr><th style="width:40px">序号</th><th>出发城市</th><th>到达城市</th><th>开始时间</th><th>结束时间</th><th>出行方式</th><th style="width:60px">操作</th></tr></thead>
              <tbody>
                <tr><td>1</td><td><input class="input" placeholder="出发城市" style="border:0;height:auto;box-shadow:none"></td><td><input class="input" placeholder="到达城市" style="border:0;height:auto;box-shadow:none"></td><td><input class="input" placeholder="开始时间" style="border:0;height:auto;box-shadow:none"></td><td><input class="input" placeholder="结束时间" style="border:0;height:auto;box-shadow:none"></td><td><div class="select" style="border:0;min-width:80px">选择 <span>▾</span></div></td><td><span class="table-action">删除</span></td></tr>
                <tr><td>2</td><td><input class="input" placeholder="出发城市" style="border:0;height:auto;box-shadow:none"></td><td><input class="input" placeholder="到达城市" style="border:0;height:auto;box-shadow:none"></td><td><input class="input" placeholder="开始时间" style="border:0;height:auto;box-shadow:none"></td><td><input class="input" placeholder="结束时间" style="border:0;height:auto;box-shadow:none"></td><td><div class="select" style="border:0;min-width:80px">选择 <span>▾</span></div></td><td><span class="table-action">删除</span></td></tr>
              </tbody>
            </table>
          </div>
          <button class="btn btn-text">+ 添加行程</button>
        </fieldset>

        <!-- 费用预算 -->
        <fieldset class="form-block">
          <legend>费用预算</legend>
          <div class="data-table-wrap" style="margin-bottom:var(--spacing-2)">
            <table class="data-table">
              <thead><tr><th style="width:40px">序号</th><th>费用类别</th><th>预估金额</th><th>备注</th><th style="width:60px">操作</th></tr></thead>
              <tbody>
                <tr><td>1</td><td><div class="select" style="border:0;min-width:100px">交通费 <span>▾</span></div></td><td><input class="input" placeholder="预估金额" style="border:0;height:auto;box-shadow:none"></td><td><input class="input" placeholder="备注说明" style="border:0;height:auto;box-shadow:none"></td><td><span class="table-action">删除</span></td></tr>
                <tr><td>2</td><td><div class="select" style="border:0;min-width:100px">住宿费 <span>▾</span></div></td><td><input class="input" placeholder="预估金额" style="border:0;height:auto;box-shadow:none"></td><td><input class="input" placeholder="备注说明" style="border:0;height:auto;box-shadow:none"></td><td><span class="table-action">删除</span></td></tr>
                <tr><td>3</td><td><div class="select" style="border:0;min-width:100px">餐饮费 <span>▾</span></div></td><td><input class="input" placeholder="预估金额" style="border:0;height:auto;box-shadow:none"></td><td><input class="input" placeholder="备注说明" style="border:0;height:auto;box-shadow:none"></td><td><span class="table-action">删除</span></td></tr>
              </tbody>
            </table>
          </div>
          <button class="btn btn-text">+ 添加费用项</button>
        </fieldset>

        <!-- 附件 -->
        <fieldset class="form-block">
          <legend>附件材料</legend>
          <div class="form-grid">
            <div class="form-field full">
              <label class="field-label">相关附件</label>
              <div style="display:flex;align-items:center;gap:var(--spacing-2);padding:var(--spacing-3);border:1px dashed var(--color-border-neutral);border-radius:var(--border-radius-regular);background:var(--color-container-bg-neutral-lightgray);color:var(--color-text-neutral-gray30);font-size:var(--font-size-small);cursor:pointer">+ 上传附件（出差审批单、邀请函等）</div>
            </div>
          </div>
        </fieldset>

        <!-- action bar -->
        <footer class="detail-action-bar">
          <div class="action-buttons">
            <span style="flex:1"></span>
            <button class="btn">保存草稿</button>
            <button class="btn-primary">提交申请</button>
          </div>
        </footer>

      </div></div></section>
    </main>
  </div>
</div>

<script>
(function(){
  function bindTabs(r){r.addEventListener("click",function(e){var c=e.target.closest("[data-tab-close]");if(c){e.stopPropagation();return}var t=e.target.closest("[data-tab-trigger]");if(!t||!r.contains(t))return;r.querySelectorAll("[data-tab-trigger]").forEach(function(i){var a=i===t;i.classList.toggle("active",a);i.classList.toggle("is-active",a);i.setAttribute("aria-selected",a?"true":"false")})})}
  function bindMenu(r){r.addEventListener("click",function(e){var i=e.target.closest("[data-menu-item]");if(i&&r.contains(i)){r.querySelectorAll("[data-menu-item]").forEach(function(c){var a=c===i;c.classList.toggle("is-active",a);c.setAttribute("aria-current",a?"page":"false")})}var t=e.target.closest("[data-menu-toggle]");if(!t||!r.contains(t))return;var g=t.closest("[data-menu-group]");var p=g?g.querySelector("[data-menu-panel]"):null;var ex=t.getAttribute("aria-expanded")==="true";t.setAttribute("aria-expanded",ex?"false":"true");t.classList.toggle("is-selected",!ex);var ar=t.querySelector(".nav-arrow");if(ar)ar.classList.toggle("contract",ex);if(p)p.hidden=ex})}
  document.querySelectorAll("[data-tabs-root]").forEach(bindTabs);
  document.querySelectorAll("[data-menu-root]").forEach(bindMenu);
})();
</script>
</body>
</html>
