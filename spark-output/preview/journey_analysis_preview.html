<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>旅程分析预览</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --line: #d8dee8;
      --header: #eef2f7;
      --accent: #2563eb;
      --green: #16803c;
      --amber: #b45309;
      --red: #b42318;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      margin-bottom: 24px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: 32px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .role {
      margin-top: 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .role-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    h2 {
      font-size: 20px;
      font-weight: 750;
    }

    .role-note {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      max-width: 560px;
    }

    .matrix-wrap {
      overflow-x: auto;
      background: var(--panel);
    }

    .matrix {
      display: grid;
      min-width: 980px;
      border-bottom: 1px solid var(--line);
    }

    .cell {
      min-height: 82px;
      padding: 14px 16px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      white-space: pre-wrap;
    }

    .stage-title {
      min-height: 64px;
      background: var(--header);
      font-weight: 750;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .row-label {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #f8fafc;
      color: #344054;
      font-weight: 750;
      border-right: 1px solid var(--line);
      display: flex;
      align-items: center;
    }

    .stage-title.row-label {
      z-index: 3;
      justify-content: flex-start;
      background: #e8edf5;
    }

    .confidence {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 9px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 750;
      border: 1px solid currentColor;
    }

    .confidence-high { color: var(--green); background: #ecfdf3; }
    .confidence-medium { color: var(--amber); background: #fffaeb; }
    .confidence-low { color: var(--red); background: #fef3f2; }

    .tag {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      margin: 0 6px 6px 0;
      color: var(--muted);
      font-size: 12px;
      background: #fff;
    }

    .opportunity {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      margin-top: 6px;
    }

    .transitions {
      padding: 14px 20px 18px;
      color: var(--muted);
      font-size: 13px;
      background: #fff;
    }

    @media (max-width: 760px) {
      .page { padding: 20px; }
      .hero, .role-head { display: block; }
      .role-note {
        margin-top: 8px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1 id="project-title">旅程分析预览</h1>
        <p class="meta" id="project-meta"></p>
      </div>
    </header>
    <section id="roles"></section>
  </main>

  <script>
    const JOURNEY_DATA = {

  "gaps": [

  "user_completion": {},
  "project_name": "子管理员权限复制能力",

  "direction": "权限复制工具——从源子管理员复制完整权限到一或多个目标",
  "journeys": [
    {
      "role": "企业超管（主管理员）",

          "opportunities": [
            {
              "direction": "提供源推荐的'权限接近度'提示",

          ]
        },
        {
          "id": 2,

          "actions": [

            "确认目标清单"
          ],
          "touchpoints": [
            "复制操作页（目标选择区）",
            "目标多选列表",
            "搜索/筛选控件",
            "权限状态指示"
          ],
          "user_voice": "这次华东区三个运营经理都要配，先看看他们现在有没有配过",
          "confidence": "高",
          "confidence_reason": "问题框定明确'单源复制到多目标'，用户故事S2完整描述",
          "pain_points": [
            "目标过多时逐一勾选+查看权限状态操作链条长",

          ],

          "opportunities": [

              "direction": "目标列表中嵌入'与源有N项差异'标签",

          ]
        },
        {
          "id": 3,
          "name": "定规则与执行",

          "actions": [

            "点击执行，等待复制完成",

          "touchpoints": [

            "进度指示器",

          "user_voice": "这些人大部分权限差不多，先追加过去，有冲突的再单独看",

          "confidence_reason": "用户故事S3描述了冲突处理，但默认策略偏好仍需与客户确认",
          "pain_points": [

          "opportunities": [
            {
              "direction": "提供执行前变更预览",
              "downstream_hint": "蓝图"
            },
            {

            },

          ],

          ],
          "user_voice": "运营经理2号的库存权限是哪儿来的？……哦，源带过来的，没问题",

          "pain_points": [

          ],
          "dropout_risk": "中——变更太多核对不过来时可能直接关闭，遗留配置错误",
          "opportunities": [
            {
              "direction": "差异对比按子应用分组，支持筛选'只看变更项'",
              "downstream_hint": "蓝图"
            },
            {
              "direction": "差异视图中支持单项回滚",
              "downstream_hint": "待确认"
            }
          ]
        },
        {
          "id": 5,
          "name": "适配收尾",
          "goal": "处理个别差异后完成配置",
          "actions": [
            "从结果摘要进入需要微调的目标编辑页",
            "搜索定位目标权限项",
            "调整不需要的权限项",
            "保存并验证生效",
            "重复至全部目标完成"
          ],
          "touchpoints": [
            "权限编辑页",
            "搜索/筛选控件",
            "权限树/列表编辑控件",
            "保存按钮"
          ],
          "user_voice": "运营经理3号跟源不一样，不用库存权限，关掉就好",
          "confidence": "中",
          "confidence_reason": "客户明确要求'复制后微调'，但交互形态待确认",
          "pain_points": [
            "多个目标都要微调时仍有一定重复感",
            "缺少'与源的差异项'高亮",
            "逐一保存容易遗漏"
          ],
          "dropout_risk": "低——已接近完成，放弃意愿低",
          "opportunities": [
            {
              "direction": "编辑页中高亮与源的差异项",
              "downstream_hint": "蓝图"
            },
            {
              "direction": "支持从摘要批量跳转需要微调的目标",
              "downstream_hint": "蓝图"
            }
          ]
        }
      ],
      "key_transitions": [
        {
          "from": "锁定参照",
          "to": "圈定目标",
          "trigger": "用户确认源子管理员可用"
        },
        {
          "from": "圈定目标",
          "to": "定规则与执行",
          "trigger": "目标清单确认"
        },
        {
          "from": "定规则与执行",
          "to": "核验结果",
          "trigger": "复制操作完成"
        },
        {
          "from": "核验结果",
          "to": "适配收尾",
          "trigger": "发现需微调的目标"
        }
      ]
    }
  ]
};

    const emptyText = "未提供";
    const rows = [
      ["goal", "用户目标"],
      ["actions", "用户行动"],
      ["touchpoints", "触点"],
      ["user_voice", "用户心声"],
      ["confidence", "信心度"],
      ["pain_points", "痛点"],
      ["dropout_risk", "流失风险"],
      ["opportunities", "设计机会"]
    ];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function text(value) {
      if (Array.isArray(value)) return value.length ? value.map(text).join("、") : emptyText;
      if (value && typeof value === "object") return text(value.direction || value.label || emptyText);
      return value || emptyText;
    }

    function confidenceClass(value) {
      if (value === "高") return "confidence-high";
      if (value === "低") return "confidence-low";
      return "confidence-medium";
    }

    function renderTags(values) {
      const list = Array.isArray(values) ? values : values ? [values] : [];
      if (!list.length) return escapeHtml(emptyText);
      return list.map((item) => `<span class="tag">${escapeHtml(text(item))}</span>`).join("");
    }

    function renderOpportunities(values) {
      const list = Array.isArray(values) ? values : [];
      if (!list.length) return escapeHtml(emptyText);
      return list.map((item) => {
        const direction = escapeHtml(text(item.direction));
        const hint = item.downstream_hint ? `（下游：${escapeHtml(item.downstream_hint)}）` : "";
        return `<div class="opportunity">${direction}${hint}</div>`;
      }).join("");
    }

    function renderValue(stage, key) {
      if (key === "touchpoints") return renderTags(stage.touchpoints);
      if (key === "opportunities") return renderOpportunities(stage.opportunities);
      if (key === "confidence") {
        const confidence = text(stage.confidence);
        const reason = text(stage.confidence_reason);
        return `<span class="confidence ${confidenceClass(confidence)}">${escapeHtml(confidence)}</span><br>${escapeHtml(reason)}`;
      }
      return escapeHtml(text(stage[key]));
    }

    function transitionText(transitions) {
      const list = Array.isArray(transitions) ? transitions : [];
      if (!list.length) return emptyText;
      return list.map((item) => `${text(item.from)} → ${text(item.to)}：${text(item.trigger)}`).join(" / ");
    }

    function renderRole(role) {
      const stages = Array.isArray(role.stages) ? role.stages : [];
      const columns = `180px repeat(${Math.max(stages.length, 1)}, minmax(180px, 1fr))`;
      const stageHeads = stages.map((stage) => `<div class="cell stage-title">${escapeHtml(text(stage.name))}</div>`).join("");
      const bodyRows = rows.map(([key, label]) => `
        <div class="cell row-label">${label}</div>
        ${stages.map((stage) => `<div class="cell">${renderValue(stage, key)}</div>`).join("")}
      `).join("");

      return `
        <section class="role">
          <div class="role-head">
            <h2>${escapeHtml(text(role.role))}</h2>
            <p class="role-note">${escapeHtml(text(role.summary))}</p>
          </div>
          <div class="matrix-wrap">
            <div class="matrix" style="grid-template-columns: ${columns};">
              <div class="cell stage-title row-label">阶段</div>
              ${stageHeads || `<div class="cell stage-title">${emptyText}</div>`}
              ${bodyRows}
            </div>
          </div>
          <div class="transitions">阶段转折：${escapeHtml(transitionText(role.key_transitions))}</div>
        </section>
      `;
    }

    function render() {
      document.getElementById("project-title").textContent = `旅程分析：${JOURNEY_DATA.project_name || emptyText}`;
      document.getElementById("project-meta").textContent = `${JOURNEY_DATA.generated_at || emptyText} / ${JOURNEY_DATA.mode || emptyText} / ${JOURNEY_DATA.source || emptyText}`;
      const roles = Array.isArray(JOURNEY_DATA.journeys) ? JOURNEY_DATA.journeys : [];
      document.getElementById("roles").innerHTML = roles.map(renderRole).join("");
    }

    render();
  </script>
</body>
</html>
