<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>旅程分析预览</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #667085;
      --line: #d8dee8;
      --header: #eef2f7;
      --accent: #2563eb;
      --green: #16803c;
      --amber: #b45309;
      --red: #b42318;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      margin-bottom: 24px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: 32px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .role {
      margin-top: 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .role-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    h2 {
      font-size: 20px;
      font-weight: 750;
    }

    .role-note {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      max-width: 560px;
    }

    .matrix-wrap {
      overflow-x: auto;
      background: var(--panel);
    }

    .matrix {
      display: grid;
      min-width: 980px;
      border-bottom: 1px solid var(--line);
    }

    .cell {
      min-height: 82px;
      padding: 14px 16px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      white-space: pre-wrap;
    }

    .stage-title {
      min-height: 64px;
      background: var(--header);
      font-weight: 750;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .row-label {
      position: sticky;
      left: 0;
      z-index: 2;
      background: #f8fafc;
      color: #344054;
      font-weight: 750;
      border-right: 1px solid var(--line);
      display: flex;
      align-items: center;
    }

    .stage-title.row-label {
      z-index: 3;
      justify-content: flex-start;
      background: #e8edf5;
    }

    .confidence {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 9px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 750;
      border: 1px solid currentColor;
    }

    .confidence-high { color: var(--green); background: #ecfdf3; }
    .confidence-medium { color: var(--amber); background: #fffaeb; }
    .confidence-low { color: var(--red); background: #fef3f2; }

    .tag {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      margin: 0 6px 6px 0;
      color: var(--muted);
      font-size: 12px;
      background: #fff;
    }

    .opportunity {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      margin-top: 6px;
    }

    .transitions {
      padding: 14px 20px 18px;
      color: var(--muted);
      font-size: 13px;
      background: #fff;
    }

    @media (max-width: 760px) {
      .page { padding: 20px; }
      .hero, .role-head { display: block; }
      .role-note {
        margin-top: 8px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1 id="project-title">旅程分析预览</h1>
        <p class="meta" id="project-meta"></p>
      </div>
    </header>
    <section id="roles"></section>
  </main>

    const emptyText = "未提供";
    const rows = [
      ["goal", "用户目标"],
      ["actions", "用户行动"],
      ["touchpoints", "触点"],
      ["user_voice", "用户心声"],
      ["confidence", "信心度"],
      ["pain_points", "痛点"],
      ["dropout_risk", "流失风险"],
      ["opportunities", "设计机会"]
    ];

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function text(value) {
      if (Array.isArray(value)) return value.length ? value.map(text).join("、") : emptyText;
      if (value && typeof value === "object") return text(value.direction || value.label || emptyText);
      return value || emptyText;
    }

    function confidenceClass(value) {
      if (value === "高") return "confidence-high";
      if (value === "低") return "confidence-low";
      return "confidence-medium";
    }

    function renderTags(values) {
      const list = Array.isArray(values) ? values : values ? [values] : [];
      if (!list.length) return escapeHtml(emptyText);
      return list.map((item) => `<span class="tag">${escapeHtml(text(item))}</span>`).join("");
    }

    function renderOpportunities(values) {
      const list = Array.isArray(values) ? values : [];
      if (!list.length) return escapeHtml(emptyText);
      return list.map((item) => {
        const direction = escapeHtml(text(item.direction));
        const hint = item.downstream_hint ? `（下游：${escapeHtml(item.downstream_hint)}）` : "";
        return `<div class="opportunity">${direction}${hint}</div>`;
      }).join("");
    }

    function renderValue(stage, key) {
      if (key === "touchpoints") return renderTags(stage.touchpoints);
      if (key === "opportunities") return renderOpportunities(stage.opportunities);
      if (key === "confidence") {
        const confidence = text(stage.confidence);
        const reason = text(stage.confidence_reason);
        return `<span class="confidence ${confidenceClass(confidence)}">${escapeHtml(confidence)}</span><br>${escapeHtml(reason)}`;
      }
      return escapeHtml(text(stage[key]));
    }

    function transitionText(transitions) {
      const list = Array.isArray(transitions) ? transitions : [];
      if (!list.length) return emptyText;
      return list.map((item) => `${text(item.from)} → ${text(item.to)}：${text(item.trigger)}`).join(" / ");
    }

    function renderRole(role) {
      const stages = Array.isArray(role.stages) ? role.stages : [];
      const columns = `180px repeat(${Math.max(stages.length, 1)}, minmax(180px, 1fr))`;
      const stageHeads = stages.map((stage) => `<div class="cell stage-title">${escapeHtml(text(stage.name))}</div>`).join("");
      const bodyRows = rows.map(([key, label]) => `
        <div class="cell row-label">${label}</div>
        ${stages.map((stage) => `<div class="cell">${renderValue(stage, key)}</div>`).join("")}
      `).join("");

      return `
        <section class="role">
          <div class="role-head">
            <h2>${escapeHtml(text(role.role))}</h2>
            <p class="role-note">${escapeHtml(text(role.summary))}</p>
          </div>
          <div class="matrix-wrap">
            <div class="matrix" style="grid-template-columns: ${columns};">
              <div class="cell stage-title row-label">阶段</div>
              ${stageHeads || `<div class="cell stage-title">${emptyText}</div>`}
              ${bodyRows}
            </div>
          </div>
          <div class="transitions">阶段转折：${escapeHtml(transitionText(role.key_transitions))}</div>
        </section>
      `;
    }

    function render() {
      document.getElementById("project-title").textContent = `旅程分析：${JOURNEY_DATA.project_name || emptyText}`;
      document.getElementById("project-meta").textContent = `${JOURNEY_DATA.generated_at || emptyText} / ${JOURNEY_DATA.mode || emptyText} / ${JOURNEY_DATA.source || emptyText}`;
      const roles = Array.isArray(JOURNEY_DATA.journeys) ? JOURNEY_DATA.journeys : [];
      document.getElementById("roles").innerHTML = roles.map(renderRole).join("");
    }

    render();
  </script>
</body>
</html>
